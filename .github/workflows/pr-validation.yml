name: PR validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
      - name: Run focused GOWA validation
        working-directory: ./src
        run: go test ./infrastructure/whatsapp ./cmd
